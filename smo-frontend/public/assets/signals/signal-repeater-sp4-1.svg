<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Repeater signal (sygnalizator powtarzający) Sp4: 40 or 60 km/h at the main signal (flashing orange), last repeater, like the SimRail wiki's drawing without the pole -->
<svg viewBox="0 0 10 30" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="10" height="24" rx="5" style="fill:#000000" />
  <circle cx="5" cy="5" r="2.3" fill="#ffc515"><animate attributeName="fill" values="#ffc515;#2b2b2b" dur="1s" calcMode="discrete" repeatCount="indefinite" /></circle>
  <circle cx="5" cy="12" r="2.3" fill="#2b2b2b"></circle>
  <circle cx="5" cy="19" r="2.3" fill="#ffffff" />
  <rect x="1.7999999999999998" y="25" width="6.4" height="5" style="fill:#e8e6e0;stroke:#000000;stroke-width:0.3" />
  <rect x="4.50" y="25.8" width="1" height="3.4" rx="0.5" style="fill:#000000" />
</svg>
