# SPA Config
server {
    listen 80 default_server http2;

    gzip on;
    gzip_types text/plain text/xml application/javascript text/css;

    root /usr/share/nginx/html;

    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Files that keep their name across builds must not be cached (has to come before the rule below, the first
    # matching regex wins): a year-long cached sw.js kept serving an old index.html, whose files no longer existed
    location ~ ^/(?:sw\.js|registerSW\.js|version\.txt|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|json|png|jpg|jpeg|gif|svg|ico|webp|txt|map|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Sentry tunnel (the SDK's `tunnel` option): the browser reports, sent only after the cookie consent, go through this
    # domain, because Firefox's strict tracking protection and blocker lists drop requests to *.sentry.io. Fixed to this
    # one project, so it can't be used to send to any other. The visitor's IP comes from NPM (X-Real-IP, the
    # CF-Connecting-IP there) and goes on as X-Forwarded-For, so Sentry still sees where reports come from.
    location = /smo-events {
        limit_except POST {
            deny all;
        }
        client_max_body_size 20m;

        # resolved at request time (Docker's DNS): the ingest address can change while the container runs
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $sentry_ingest o260759.ingest.us.sentry.io;
        proxy_pass https://$sentry_ingest/api/4507205489262592/envelope/;
        proxy_ssl_server_name on;
        proxy_ssl_name $sentry_ingest;
        proxy_http_version 1.1;
        proxy_set_header Host $sentry_ingest;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
    }
}
