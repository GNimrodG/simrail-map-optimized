name: Frontend

on:
  push:
    branches:
      - master
    paths:
      - "smo-frontend/**"
      - ".github/workflows/build-frontend.yml"
  pull_request:
    branches:
      - master
    paths:
      - "smo-frontend/**"

jobs:
  build-frontend:
    name: Build and Push
    runs-on: ubuntu-latest
    env:
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && secrets.DOCKER_REGISTRY_USERNAME != '' }}
      DEPLOYMENT_WEBHOOK_URL: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Dynamic image name: if DOCKER_REGISTRY_URL is set use <registry>/smo-frontend, otherwise just 'smo-frontend'
          images: ${{ vars.DOCKER_REGISTRY_URL && format('{0}/smo-frontend', vars.DOCKER_REGISTRY_URL) || 'smo-frontend' }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=sha
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to the registry
        if: ${{ env.SHOULD_PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./smo-frontend
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # webhook to trigger deployment, only when an image was pushed and the secret is set
      - name: Bypass Cloudflare for GitHub Action
        continue-on-error: true
        if: env.SHOULD_PUSH == 'true' && env.DEPLOYMENT_WEBHOOK_URL != ''
        uses: xiaotianxt/bypass-cloudflare-for-github-action@v2.1.0
        with:
          cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          cf_zone_id: ${{ secrets.CF_ZONE_ID }}
          cf_api_token: ${{ secrets.CF_API_TOKEN }}
          disable_bot_fight_mode: "true"
          bfm_propagation_delay: "30"
      # Bot Fight Mode can keep challenging for a while after it's disabled, so retry
      # until the webhook accepts the redeploy (202) instead of giving up on the first 403.
      - name: Deploy
        continue-on-error: true
        if: env.SHOULD_PUSH == 'true' && env.DEPLOYMENT_WEBHOOK_URL != ''
        run: |
          for attempt in $(seq 1 8); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$DEPLOYMENT_WEBHOOK_URL")
            if [ "$status" = 202 ] || [ "$status" = 200 ]; then echo "Deployment triggered (HTTP $status)"; exit 0; fi
            echo "Attempt $attempt: HTTP $status, retrying in 15s"
            sleep 15
          done
          echo "::error::Deployment webhook was not accepted"
          exit 1
