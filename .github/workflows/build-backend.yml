name: Backend

on:
  # a manual run (Actions > Run workflow, on master) deploys right away; a push only pushes the image
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "smo-backend/**"
      - ".github/workflows/build-backend.yml"
      - ".github/scripts/smoke-test-backend.sh"
  pull_request:
    branches:
      - master
    paths:
      - "smo-backend/**"
      - ".github/workflows/build-backend.yml"
      - ".github/scripts/smoke-test-backend.sh"

jobs:
  test-backend:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ./smo-backend/smo-backend.sln
      - name: Test
        id: run-tests
        continue-on-error: true
        run: >-
          dotnet test ./smo-backend/smo-backend.Tests/smo-backend.Tests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./smo-backend/TestResults
      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Backend Tests
          path: smo-backend/TestResults/*.trx
          reporter: dotnet-trx
      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

  build-backend:
    name: Build and Push
    needs: test-backend
    runs-on: ubuntu-latest
    env:
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && secrets.DOCKER_REGISTRY_USERNAME != '' }}
      DEPLOYMENT_WEBHOOK_URL: ${{ secrets.BACKEND_DEPLOYMENT_WEBHOOK_URL }}
      # at most one deploy a day: the image pushed on master is deployed by the nightly Arcane updater (it checks
      # the Nexus images hourly), the webhook only on a manual run
      SHOULD_DEPLOY: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          # Dynamic image name: if DOCKER_REGISTRY_URL is set use <registry>/smo-backend, otherwise just 'smo-backend'
          # (repository variables aren't passed to pull requests from forks)
          images: ${{ vars.DOCKER_REGISTRY_URL && format('{0}/smo-backend', vars.DOCKER_REGISTRY_URL) || 'smo-backend' }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=sha
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to the registry
        if: ${{ env.SHOULD_PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
      # Boot the real image against a throwaway PostGIS before anything is pushed, so PRs
      # (incl. Renovate bumps like the .NET 11 base image) that break startup fail here instead.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: ./smo-backend
          load: true
          tags: smo-backend:smoke-${{ github.run_id }}
          cache-from: type=gha,scope=backend
      - name: Smoke test
        run: bash .github/scripts/smoke-test-backend.sh smo-backend:smoke-${{ github.run_id }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./smo-backend
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # webhook to trigger deployment right away (Arcane redeploy), only on a manual run, when an image was pushed and
      # the secret is set
      - name: Bypass Cloudflare for GitHub Action
        continue-on-error: true
        if: env.SHOULD_PUSH == 'true' && env.SHOULD_DEPLOY == 'true' && env.DEPLOYMENT_WEBHOOK_URL != ''
        uses: xiaotianxt/bypass-cloudflare-for-github-action@v2.1.0
        with:
          cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          cf_zone_id: ${{ secrets.CF_ZONE_ID }}
          cf_api_token: ${{ secrets.CF_API_TOKEN }}
          disable_bot_fight_mode: "true"
          bfm_propagation_delay: "30"
      # Bot Fight Mode can keep challenging for a while after it's disabled, so retry
      # until the webhook accepts the redeploy (202) instead of giving up on the first 403.
      - name: Deploy
        continue-on-error: true
        if: env.SHOULD_PUSH == 'true' && env.SHOULD_DEPLOY == 'true' && env.DEPLOYMENT_WEBHOOK_URL != ''
        run: |
          for attempt in $(seq 1 8); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$DEPLOYMENT_WEBHOOK_URL")
            if [ "$status" = 202 ] || [ "$status" = 200 ]; then echo "Deployment triggered (HTTP $status)"; exit 0; fi
            echo "Attempt $attempt: HTTP $status, retrying in 15s"
            sleep 15
          done
          echo "::error::Deployment webhook was not accepted"
          exit 1
